# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LLMFactory"
version = "0.1.0"
description = "A factory for creating clients for various LLM providers."
readme = "README.md"
requires-python = ">=3.12"


dependencies = [
    "anthropic>=0.57.1",
    "Pillow>=11.3.0",
    "pydantic>=2.11.7",
    "Requests>=2.32.4",
    "openai>=1.0.0",
    "google-genai>=1.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]